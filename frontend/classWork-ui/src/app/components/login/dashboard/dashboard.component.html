<div class="dashboard-wrapper">
  <!-- Top Navigation Toolbar -->
  <mat-toolbar class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand-badge">
        <mat-icon>school</mat-icon>
      </div>
      <div class="navbar-titles">
        <span class="app-title">Classwork</span>
        <span class="page-tag">Teacher Portal</span>
      </div>
    </div>

    <div class="navbar-right">
      <div class="user-pill">
        <span class="status-dot"></span>
        <span class="user-label">Teacher Active</span>
      </div>

      <button
        mat-stroked-button
        color="warn"
        class="logout-btn"
        (click)="logout()"
        aria-label="Log out of application"
      >
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </mat-toolbar>

  <!-- Main Content Body -->
  <main class="dashboard-content">
    <!-- Welcome Header Banner -->
    <div class="welcome-banner">
      <div class="banner-text">
        <h2>Teacher Dashboard</h2>
        <p>Publish homework assignments, attach study material, and manage your classrooms.</p>
      </div>

      <div class="quick-stats">
        <div class="stat-card">
          <mat-icon class="stat-icon">assignment</mat-icon>
          <div class="stat-info">
            <span class="stat-value">{{ activeCount() }}</span>
            <span class="stat-label">Active Assignments</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 2-Column Responsive Layout -->
    <div class="dashboard-grid">
      <!-- Left Column: Creation Modes (AI Generator & Manual Form) -->
      <section class="grid-col form-col">
        <!-- Tab Switcher -->
        <div class="mode-tabs-container">
          <button
            type="button"
            class="mode-tab-btn"
            [class.active]="activeTab() === 'ai'"
            (click)="activeTab.set('ai')"
          >
            <mat-icon class="tab-icon">auto_awesome</mat-icon>
            <span>AI Generator</span>
            <span class="ai-badge">Gemini</span>
          </button>

          <button
            type="button"
            class="mode-tab-btn"
            [class.active]="activeTab() === 'manual'"
            (click)="activeTab.set('manual')"
          >
            <mat-icon class="tab-icon">edit_note</mat-icon>
            <span>Manual Create</span>
          </button>
        </div>

        @if (activeTab() === 'ai') {
          <app-ai-generator (assignmentPublished)="onHomeworkCreated()"></app-ai-generator>
        } @else {
          <app-homework-form (homeworkCreated)="onHomeworkCreated()"></app-homework-form>
        }
      </section>

      <!-- Right Column: Homework Assignments List -->
      <section class="grid-col list-col">
        <app-homework-list
          [homeworks]="homeworks()"
          [isLoading]="isLoading()"
          [errorMessage]="errorMessage()"
          (refreshRequested)="loadHomeworks()"
        ></app-homework-list>
      </section>
    </div>
  </main>
</div>
