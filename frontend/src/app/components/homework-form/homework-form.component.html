<div style="margin-top:10px;">
  <mat-form-field style="width:100%"><input matInput placeholder="Title" [(ngModel)]="title"></mat-form-field>
  <mat-form-field style="width:100%"><input matInput placeholder="Class (eg. 5A)" [(ngModel)]="className"></mat-form-field>
  <mat-form-field style="width:100%"><input matInput placeholder="Subject" [(ngModel)]="subject"></mat-form-field>
  <mat-form-field style="width:100%"><textarea matInput placeholder="Description" [(ngModel)]="description"></textarea></mat-form-field>
  <button mat-raised-button color="accent" (click)="create()">Create Homework</button>
</div>
